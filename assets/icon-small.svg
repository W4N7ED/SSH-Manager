<!--
  SSH Manager — variante petite taille de la marque (16 et 24 px).

  Reprise du gabarit 16 px de la planche de logos : le chevron y démarre à 8
  plutôt qu'à 7 et son trait passe de 3,2 à 5, sinon le dessin se referme et
  devient illisible une fois réduit. Le curseur est calé sur des pixels entiers
  pour rester net. Le grand format vit dans icon.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="4" fill="#9a6bff"/>

  <g transform="translate(1.25 4) scale(0.3333333)"
     fill="none" stroke="#150e26" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="8 6 14 12 8 18"/>
  </g>

  <rect x="11" y="5" width="2" height="6" rx="1" fill="#150e26"/>
</svg>
